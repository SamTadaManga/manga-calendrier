<!doctype html><meta charset="utf-8">
<style>

h1{position:absolute;left:80px;top:215px;margin:0;font-size:150px;line-height:1;font-weight:900;font-style:italic;letter-spacing:-5px}

.pubs span{padding:10px 22px;border:5px solid #111;background:#fff;font-size:30px;font-weight:800;box-shadow:7px 7px 0 #111}
.pubs i{display:inline-block;width:20px;height:20px;border-radius:50%;margin-right:10px;vertical-align:-1px}
</style>
