<!doctype html><meta charset="utf-8">

<style>

.pill{position:absolute;left:76px;top:470px;background:#111;color:#ffd21f;font-family:Dela;font-size:30px;padding:10px 26px;border-radius:40px}
.u{position:absolute;right:70px;bottom:46px;font-family:Dela;font-size:38px}
