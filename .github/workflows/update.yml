name: Mise à jour quotidienne
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manga-calendrier
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sorties manga saisies à la main (Google Sheets)
        run: node scripts/fetch-manga.mjs
        env:
          MANGA_CSV_URL: ${{ secrets.MANGA_CSV_URL }}
      - name: Sorties manga des éditeurs (Glénat, Kana, Pika, Ki-oon)
        run: node scripts/collect-manga.mjs
        continue-on-error: true
      - name: Épisodes d'anime
        run: node scripts/fetch-anime.mjs
      - name: Articles du jour
        run: node scripts/daily-articles.mjs
      - name: Vérification de la construction
        run: node scripts/build.mjs
      - name: Enregistrer les changements
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A manga-calendrier/data manga-calendrier/content
          if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
          git commit -m "Mise à jour automatique des données"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
