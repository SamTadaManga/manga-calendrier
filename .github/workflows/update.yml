name: Mise à jour quotidienne
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manga-calendrier/scripts/**'
      - 'manga-calendrier/site.config.json'
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manga-calendrier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sorties manga saisies à la main (Google Sheets)
        run: node scripts/fetch-manga.mjs
        env:
          MANGA_CSV_URL: ${{ secrets.MANGA_CSV_URL }}
      - name: Sorties manga des éditeurs (Glénat, Kana, Pika, Ki-oon)
        run: node scripts/collect-manga.mjs
        continue-on-error: true
      - name: Compléments (Google Books et flux RSS des autres éditeurs)
        run: node scripts/collect-extra.mjs
        continue-on-error: true
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      - name: Résumés des mangas (pages des éditeurs)
        run: node scripts/collect-synopsis.mjs
        continue-on-error: true
      - name: Adaptations animées des séries manga
        run: node scripts/fetch-adaptations.mjs
        continue-on-error: true
      - name: Anime de la saison
        run: node scripts/fetch-season.mjs
        continue-on-error: true
      - name: Épisodes d'anime
        run: node scripts/fetch-anime.mjs
      - name: Traduction des synopsis d'anime en français
        run: node scripts/translate-synopsis.mjs
        continue-on-error: true
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
      - name: Articles du jour
        run: node scripts/daily-articles.mjs
      - name: Dossiers éditoriaux automatiques
        run: node scripts/dossiers-auto.mjs
      - name: Vérification de la construction
        run: node scripts/build.mjs
      - name: Enregistrer les changements
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEEP="$RUNNER_TEMP/keep"
          rm -rf "$KEEP"; mkdir -p "$KEEP/content-auto"
          cp -r manga-calendrier/data "$KEEP/data"
          cp -r manga-calendrier/content/auto/. "$KEEP/content-auto/"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p manga-calendrier/data manga-calendrier/content/auto
            cp -r "$KEEP/data/." manga-calendrier/data/
            cp -r "$KEEP/content-auto/." manga-calendrier/content/auto/
            git add -A manga-calendrier/data manga-calendrier/content
            if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
            git commit -m "Mise à jour automatique des données"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push refusé (essai $i), nouvel essai…"; sleep 5
          done
          exit 1
      - name: Contrôle de fraîcheur des sources
        run: node scripts/check-status.mjs
  alerte:
    # Si la mise à jour échoue, ouvre (ou complète) un ticket : GitHub t'envoie alors un e-mail
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou compléter le ticket d'alerte
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Alerte : la mise à jour quotidienne a échoué"
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          BODY="La mise à jour a échoué le $(date -u +%F) : $RUN_URL"
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY (ce ticket se complète à chaque nouvel échec ; ferme-le quand c'est réglé)"; fi
