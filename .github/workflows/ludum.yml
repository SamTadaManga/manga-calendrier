name: Liens Ludum (flux produits)
# Télécharge le flux produits public de Ludum (https://www.ludum.fr/flux-mangas-ludum, mis à jour chaque jour vers 5 h heure de Paris) et met à jour :
# data/ludum-produits.json (titre, éditeur, date, état et prix de chaque fiche, repris par data/base-isbn.csv), data/ludum-liens.json (lien direct vers la fiche de chaque tome disponible), data/catalogue-ajouts.json (tomes absents du catalogue : trous de numérotation et tomes suivants)
# et data/ludum-images.json (images pour les couvertures manquantes ; utilisées tant que ce fichier contient "autorise": true).
# Aucun secret nécessaire. Le bouton Ludum du site dépend de shops.ludum dans site.config.json ({ "enabled": true, "aff": "<numéro d'affilié, facultatif>" }).
# Chaque nuit à 4 h 47 UTC (après la mise à jour du flux), même groupe que les autres flux produits : jamais en même temps. Le fichier n'est enregistré que s'il a changé.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai à blanc (affiche le bilan sans rien enregistrer)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cultura
  cancel-in-progress: false
jobs:
  ludum:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: manga-calendrier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lire le flux
        run: node scripts/ludum-flux.mjs ${{ inputs.essai && '--essai' || '' }}
      - name: Enregistrer
        if: ${{ !inputs.essai }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEEP="$RUNNER_TEMP/keep"
          mkdir -p "$KEEP"
          FILES="ludum-liens.json ludum-images.json ludum-produits.json catalogue-ajouts.json"
          for f in $FILES; do [ -f "manga-calendrier/data/$f" ] && cp "manga-calendrier/data/$f" "$KEEP/$f"; done
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for f in $FILES; do [ -f "$KEEP/$f" ] && cp "$KEEP/$f" "manga-calendrier/data/$f"; done
            for f in $FILES; do [ -f "manga-calendrier/data/$f" ] && git add "manga-calendrier/data/$f"; done
            if git diff --cached --quiet; then echo "Rien à enregistrer."; exit 0; fi
            git commit -m "Flux Ludum : liens, tomes du catalogue et images mis à jour"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
