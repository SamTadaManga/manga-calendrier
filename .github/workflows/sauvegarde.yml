name: Sauvegarde hebdomadaire
# Archive les données et les contenus (le code et l'historique sont déjà dans git).
# Le fichier est téléchargeable 90 jours depuis l'onglet Actions > cette exécution > Artifacts.
on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive
        run: |
          mkdir -p "$RUNNER_TEMP/s"
          tar czf "$RUNNER_TEMP/s/sauvegarde-$(date -u +%F).tar.gz" manga-calendrier/data manga-calendrier/content manga-calendrier/site.config.json
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-donnees
          path: ${{ runner.temp }}/s/
          retention-days: 90
  alerte:
    needs: sauvegarde
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "Alerte, la sauvegarde hebdomadaire a échoué" --body "$RUN_URL"
