name: Repérage des éditeurs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manga-calendrier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repérer les pages de planning des éditeurs
        run: node scripts/probe-publishers.mjs
      - name: Essayer les adresses classiques de planning
        run: node scripts/probe-planning.mjs
        continue-on-error: true
