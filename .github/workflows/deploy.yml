name: Déploiement Cloudflare
# Déploie le site directement depuis GitHub, sans passer par Cloudflare Builds
# (utile quand ses builds restent bloqués). Nécessite les secrets
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_run:
    # les commits du bot ne déclenchent pas « push » : on réagit à la fin de la mise à jour
    workflows: ['Mise à jour quotidienne']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manga-calendrier
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construction du site
        run: node scripts/build.mjs
        env:
          OUT_DIR: dist
      - name: Vérifier les identifiants Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN et/ou CLOUDFLARE_ACCOUNT_ID manquants (Settings > Secrets and variables > Actions)."; exit 1; fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Déploiement
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  alerte:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou compléter le ticket d'alerte
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Alerte : le déploiement du site a échoué"
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          BODY="Le déploiement a échoué le $(date -u +%F) : $RUN_URL"
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY (ce ticket se complète à chaque nouvel échec ; ferme-le quand c'est réglé)"; fi
